name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Gradle Wrapper (if missing)
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper
        fi

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Create debug keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
        cp ~/.android/debug.keystore ./debug.keystore

    - name: Build Debug APK
      env:
        SUPABASE_URL: ${{ https://vuncvrkrjrqrmwusumdb.supabase.co/rest/v1/ }}
        SUPABASE_ANON_KEY: ${{ sb_publishable_uVfiX9pfEWjLEdJESpLizA_JSvb1OIM }}
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
